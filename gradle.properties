org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true

minecraft_version=1.21.1
# Upper bound is 1.21.2, not 1.22: 1.21.2 reworked the recipe API this mod is built on
# (RecipeHolder.id() returns a ResourceKey, Ingredient.getItems() and Recipe.getIngredients()
# are gone, ServerRecipeBook was rebuilt). Measured: the core produces 8 compile errors there.
# A looser range would load the mod and then throw NoSuchMethodError on the first recipe scan.
minecraft_version_range=[1.21,1.21.2)

# Vanilla Minecraft for the common subproject, which must compile without any loader.
neoform_version=1.21.1-20240808.144430

# NeoForge
neo_version=21.1.248
# NeoForge 21.1.x is Minecraft 1.21.1; 21.2.x is 1.21.2. Bounded for the same reason as
# minecraft_version_range above.
neo_version_range=[21.0.0,21.2)
loader_version_range=[4,)

# Fabric
fabric_loader_version=0.19.3
fabric_api_version=0.116.15+1.21.1
# Same bound as minecraft_version_range, expressed in Fabric's semver syntax rather than
# Maven's. Keep the two in step.
fabric_minecraft_range=>=1.21 <1.21.2

# Used only to name the jar, so it can describe a span that minecraft_version cannot.
# Single version:  1.21.1
# Range:           1.21.2-1.21.11
supported_versions=1.21.1

mod_id=errata
mod_name=Errata
mod_license=MIT
mod_version=1.1.0
mod_group_id=dev.itomma.errata
mod_authors=Christian
mod_description=A published list of corrections for your recipe book. Unlocks modded recipes that ship without an unlock advancement, and repairs advancements written for pre-1.20.5 that fire on any pickup.
